name: e2e

# The browser end-to-end run needs Chromium, and the container build is slow. Both
# are non-diff work, so they run on `main`, weekly and on demand instead of on the
# required pull request path. See the owner standard C5.4.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Install dependencies
        run: just deps
      - name: Install Playwright Chromium
        run: mise exec -- bunx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: just test-e2e

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the container image
        run: docker build -t playwright-api-wrapper:ci .
