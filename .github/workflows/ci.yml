name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check formatting
        run: just fmt-check

  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # This job runs lefthook and nothing else, so it installs one tool
      # instead of the whole pinned set (C5.2).
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: aqua:evilmartians/lefthook
      - name: Fetch the shared hook config
        run: lefthook install
      - name: Assert the merged config
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-signing; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate hook config
        run: lefthook validate

  lint:
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@bcd83ee3d1139e05f936f306bdc24ab96cbdb8dd # repo-standard, pinned commit
  aislop:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@bcd83ee3d1139e05f936f306bdc24ab96cbdb8dd # repo-standard, pinned commit
  security:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@bcd83ee3d1139e05f936f306bdc24ab96cbdb8dd # repo-standard, pinned commit
  standard:
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@bcd83ee3d1139e05f936f306bdc24ab96cbdb8dd # repo-standard, pinned commit
  coverage:
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/coverage.yml@bcd83ee3d1139e05f936f306bdc24ab96cbdb8dd # repo-standard, pinned commit

  # Required. Unit and integration tests need no browser, so they run here. The
  # Chromium e2e run and the container build are slow and do not diff; they run in
  # the `e2e` workflow on main, weekly and on demand. See the owner standard C5.4.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Restore the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: just deps
      - name: Lint
        run: just lint
      - name: Type check
        run: just typecheck
      - name: Unit and integration tests
        run: just test
