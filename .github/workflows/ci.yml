name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check formatting
        run: just fmt-check

  lint:
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@86bf84b45d36ea61610fd591e1b81497cf868cd5 # repo-standard, pinned commit
  aislop:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@86bf84b45d36ea61610fd591e1b81497cf868cd5 # repo-standard, pinned commit
  security:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@86bf84b45d36ea61610fd591e1b81497cf868cd5 # repo-standard, pinned commit
  standard:
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@86bf84b45d36ea61610fd591e1b81497cf868cd5 # repo-standard, pinned commit
  coverage:
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/coverage.yml@86bf84b45d36ea61610fd591e1b81497cf868cd5 # repo-standard, pinned commit

  # Required. Unit and integration tests need no browser, so they run here. The
  # Chromium e2e run and the container build are slow and do not diff; they run in
  # the `e2e` workflow on main, weekly and on demand. See the owner standard C5.4.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Install dependencies
        run: just deps
      - name: Lint
        run: just lint
      - name: Type check
        run: just typecheck
      - name: Unit and integration tests
        run: just test
