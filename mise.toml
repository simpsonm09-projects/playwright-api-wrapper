# Tools for playwright-api-wrapper. Versions match the owner standard's pinning table.
# See https://github.com/simpsonm09-projects/repo-standard/blob/main/docs/linting.md

[tools]

# Task runner
"aqua:casey/just" = "1.59.0"

# Git hooks and secret scanning
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"

# CI linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# JavaScript and TypeScript toolchain. Bun formats, lints, type checks, tests and
# runs the dev server. The container still runs Node.
bun = "1.4.5"
node = "26.13.1"

# AI-slop gate, pinned so CI resolves no version at run time (C7.2).
"npm:aislop" = "0.16.1"
"npm:oxlint" = "1.93.0"

# Linters
"aqua:grafana/flint" = "0.22.14"

[env]
FLINT_CONFIG_DIR = ".github/config"
